<body>
    <!-- 登录页面 -->
    <div class="login-wrap" id="loginPage">
        <div class="login-box">
            <h2>单词背诵系统 - 登录</h2>
            <div class="login-item">
                <label>登录密码</label>
                <input type="password" id="pwdInput" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="login()">登 录</button>
            <div class="login-tip" id="loginTip">密码错误，请重新输入</div>
        </div>
    </div>

    <!-- 主系统页面（登录后显示） -->
    <div class="main-system" id="mainPage">
        <h1>单词背诵系统</h1>
        <p class="subtitle" id="totalWords">词库加载中...</p>

        <div class="tabs">
            <button class="tab-btn active" data-tab="wordList">单词表</button>
            <button class="tab-btn" data-tab="studyTest">学习测试</button>
            <button class="tab-btn" data-tab="errorList">错误表</button>
        </div>

        <!-- 单词表 -->
        <div id="wordList" class="tab-content active">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>单词</th>
                        <th>音标</th>
                        <th>释义</th>
                        <th>多义短语</th>
                        <th>派生词</th>
                        <th>标签</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="wordTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: #666;">加载中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination">
                <button id="prevBtn">上一页</button>
                <span id="pageInfo"></span>
                <input type="number" id="jumpPageInput" placeholder="页码" min="1">
                <button id="jumpBtn">跳转</button>
                <button id="nextBtn">下一页</button>
            </div>
        </div>

        <!-- 学习测试 -->
        <div id="studyTest" class="tab-content">
            <div class="form-group">
                <label>起始ID：</label>
                <input type="number" id="startId" min="1" value="1">
            </div>
            <div class="form-group">
                <label>结束ID：</label>
                <input type="number" id="endId" min="1" value="15">
            </div>
            <div class="form-group">
                <label>仅错题：</label>
                <input type="checkbox" id="onlyWrong">
            </div>
            <button class="btn" style="background-color:#2563eb; color:white;" onclick="startTest()">开始测试</button>

            <div class="test-area" id="testArea" style="display: none;">
                <div class="explain-text" id="explainText"></div>
                <input type="text" id="userAnswer" placeholder="请输入对应的单词" style="width: 300px; padding: 10px; font-size: 16px;">
                <button class="btn" style="background-color:#2563eb; color:white; margin-left:10px;" onclick="submitAnswer()">提交</button>
                <div class="result" id="resultText"></div>
            </div>
        </div>

        <!-- 错误表 -->
        <div id="errorList" class="tab-content">
            <div class="form-group">
                <label>排序方式：</label>
                <select id="sortOption">
                    <option value="id_asc">ID号从小到大</option>
                    <option value="id_desc">ID号从大到小</option>
                    <option value="time_desc">学习时间从后往前</option>
                    <option value="time_asc">学习时间从前往后</option>
                    <option value="wrong_desc">错误数从大到小</option>
                    <option value="wrong_asc">错误数从小到大</option>
                    <option value="rate_desc">错误率从大到小</option>
                    <option value="rate_asc">错误率从小到大</option>
                </select>
                <button class="btn" style="background-color:#2563eb; color:white; margin-left:10px;" onclick="loadErrorList()">刷新</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>单词</th>
                        <th>音标</th>
                        <th>释义</th>
                        <th>多义短语</th>
                        <th>派生词</th>
                        <th>测试次数</th>
                        <th>错误次数</th>
                        <th>错误率</th>
                    </tr>
                </thead>
                <tbody id="errorTableBody">
                    <tr>
                        <td colspan="9" style="text-align: center; color: #666;">加载中...</td>
                    </tr>
                </tbody>
            </table>
            <div class="pagination">
                <button id="errorPrevBtn">上一页</button>
                <span id="errorPageInfo"></span>
                <input type="number" id="errorJumpPageInput" placeholder="页码" min="1">
                <button id="errorJumpBtn">跳转</button>
                <button id="errorNextBtn">下一页</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 配置区 ==========
        const SUPABASE_URL = "https://ujqfiphuffjeihdvlupf.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7qutUQOaUp_HKon9uLK6PQ_LkM_Bx0y";
        const reqHeaders = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
        // 固定登录密码
        const LOGIN_PWD = "123456";

        let currentPage = 1;
        const pageSize = 10;
        let allWords = [];
        let testQueue = [];
        let currentTestIndex = 0;
        let testCorrectCount = 0;
        let testWrongCount = 0;

        // 错误表分页变量
        let errorData = [];
        let errorCurrentPage = 1;
        const errorPageSize = 10;

        // 登录逻辑
        function login() {
            const pwd = document.getElementById('pwdInput').value.trim();
            const tip = document.getElementById('loginTip');
            if (pwd === LOGIN_PWD) {
                // 密码正确，切换到主页面
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainPage').style.display = 'block';
                // 登录后加载单词表
                loadWords();
            } else {
                tip.style.display = 'block';
            }
        }

        // 回车快捷登录
        document.getElementById('pwdInput').addEventListener('keydown', function(e){
            if(e.key === 'Enter') login();
        });

        // 标签切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'wordList') loadWords();
                if (btn.dataset.tab === 'errorList') loadErrorList();
            });
        });

        // 单词表加载
        async function loadWords() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/words?select=*&order=id.asc`, { headers: reqHeaders });
                allWords = await res.json();
                document.getElementById('totalWords').textContent = `词库共 ${allWords.length} 个单词`;

                const start = (currentPage - 1) * pageSize;
                const pageWords = allWords.slice(start, start + pageSize);
                const tbody = document.getElementById('wordTableBody');
                tbody.innerHTML = "";

                if (pageWords.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无数据</td></tr>';
                } else {
                    pageWords.forEach(word => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${word.id}</td>
                            <td>${word.word}</td>
                            <td>${word.phonetic || ''}</td>
                            <td>${word.explain || ''}</td>
                            <td>${word.polysemy || ''}</td>
                            <td>${word.derivative || ''}</td>
                            <td>${word.tag || ''}</td>
                            <td><button class="btn btn-read" onclick="readWord(this,'${word.word}')">朗读</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                const total = Math.ceil(allWords.length / pageSize);
                document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${total} 页`;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage >= total;
            } catch (e) {
                document.getElementById('wordTableBody').innerHTML = `<tr><td colspan="8" style="color:red;text-align:center;">加载失败</td></tr>`;
                document.getElementById('totalWords').textContent = `词库加载失败`;
            }
        }

        function readWord(btn, word) {
            document.querySelectorAll('#wordTableBody tr').forEach(tr => tr.classList.remove('highlight'));
            btn.closest('tr').classList.add('highlight');
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            speechSynthesis.speak(u);
        }

        document.getElementById('prevBtn').onclick = () => { if (currentPage > 1) { currentPage--; loadWords(); } };
        document.getElementById('nextBtn').onclick = () => {
            const total = Math.ceil(allWords.length / pageSize);
            if (currentPage < total) { currentPage++; loadWords(); }
        };
        document.getElementById('jumpBtn').onclick = () => {
            const target = parseInt(document.getElementById('jumpPageInput').value);
            const total = Math.ceil(allWords.length / pageSize);
            if (target >= 1 && target <= total) { currentPage = target; loadWords(); }
        };

        // 学习测试
        async function startTest() {
            const sId = +document.getElementById('startId').value;
            const eId = +document.getElementById('endId').value;
            const onlyWrong = document.getElementById('onlyWrong').checked;

            let words = await (await fetch(`${SUPABASE_URL}/rest/v1/words?select=*&id=gte.${sId}&id=lte.${eId}`, { headers: reqHeaders })).json();
            if (onlyWrong) {
                const recs = await (await fetch(`${SUPABASE_URL}/rest/v1/learnrecord?select=word_id&wrong_num=gt.0`, { headers: reqHeaders })).json();
                const set = new Set(recs.map(r => r.word_id));
                words = words.filter(w => set.has(w.id));
            }
            testQueue = words;
            currentTestIndex = 0;
            testCorrectCount = 0;
            testWrongCount = 0;
            document.getElementById('testArea').style.display = 'block';
            showNextQuestion();
        }

        function showNextQuestion() {
            if (currentTestIndex >= testQueue.length) {
                document.getElementById('testArea').style.display = 'none';
                const total = testQueue.length;
                const rate = total > 0 ? (testCorrectCount / total * 100).toFixed(1) : 0;
                alert(`本次学习测试共 ${total} 个单词\n回答正确 ${testCorrectCount} 个，错误 ${testWrongCount} 个\n正确率 ${rate}%`);
                return;
            }
            const w = testQueue[currentTestIndex];
            document.getElementById('explainText').textContent = w.explain;
            document.getElementById('userAnswer').value = '';
            document.getElementById('resultText').textContent = '';
            document.getElementById('userAnswer').focus();
        }

        async function submitAnswer() {
            const w = testQueue[currentTestIndex];
            const ans = document.getElementById('userAnswer').value.trim().toLowerCase();
            const ok = ans === w.word.toLowerCase();
            document.getElementById('resultText').innerHTML = ok ? '✅ 正确！' : `❌ 错误，正确答案是：${w.word}`;
            document.getElementById('resultText').className = 'result ' + (ok ? 'correct' : 'wrong');

            if (ok) {
                testCorrectCount++;
            } else {
                testWrongCount++;
            }

            await updateRecord(w.id, ok);
            setTimeout(() => { currentTestIndex++; showNextQuestion(); }, 1000);
        }

        async function updateRecord(wid, ok) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/learnrecord?word_id=eq.${wid}`, { headers: reqHeaders });
            const list = await res.json();
            const now = new Date().toISOString();
            if (list.length === 0) {
                await fetch(`${SUPABASE_URL}/rest/v1/learnrecord`, {
                    method: 'POST',
                    headers: { ...reqHeaders, "Prefer": "return=representation" },
                    body: JSON.stringify({ word_id: wid, test_num: 1, wrong_num: ok ? 0 : 1, last_time: now })
                });
            } else {
                const r = list[0];
                await fetch(`${SUPABASE_URL}/rest/v1/learnrecord?word_id=eq.${wid}`, {
                    method: 'PATCH',
                    headers: { ...reqHeaders, "Prefer": "return=representation" },
                    body: JSON.stringify({
                        test_num: r.test_num + 1,
                        wrong_num: ok ? r.wrong_num : r.wrong_num + 1,
                        last_time: now
                    })
                });
            }
        }

        // 错误表（带分页、多义短语/派生词列）
        async function loadErrorList() {
            const sort = document.getElementById('sortOption').value;
            const tbody = document.getElementById('errorTableBody');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">加载中...</td></tr>';
            errorCurrentPage = 1;

            try {
                const recs = await (await fetch(`${SUPABASE_URL}/rest/v1/learnrecord?select=*&wrong_num=gt.0`, { headers: reqHeaders })).json();
                if (recs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">暂无错误记录</td></tr>';
                    return;
                }

                const wordIds = recs.map(r => r.word_id);
                const words = await (await fetch(`${SUPABASE_URL}/rest/v1/words?select=*&id=in.(${wordIds.join(',')})`, { headers: reqHeaders })).json();

                errorData = recs.map(r => {
                    const w = words.find(wd => wd.id === r.word_id);
                    if (!w) return null;
                    const rate = r.test_num > 0 ? (r.wrong_num / r.test_num * 100).toFixed(1) : 0;
                    return {
                        ...w,
                        test_num: r.test_num,
                        wrong_num: r.wrong_num,
                        last_time: r.last_time,
                        rate: rate
                    };
                }).filter(Boolean);

                // 排序
                switch (sort) {
                    case 'id_asc': errorData.sort((a, b) => a.id - b.id); break;
                    case 'id_desc': errorData.sort((a, b) => b.id - a.id); break;
                    case 'time_asc': errorData.sort((a, b) => new Date(a.last_time) - new Date(b.last_time)); break;
                    case 'time_desc': errorData.sort((a, b) => new Date(b.last_time) - new Date(a.last_time)); break;
                    case 'wrong_asc': errorData.sort((a, b) => a.wrong_num - b.wrong_num); break;
                    case 'wrong_desc': errorData.sort((a, b) => b.wrong_num - a.wrong_num); break;
                    case 'rate_asc': errorData.sort((a, b) => a.rate - b.rate); break;
                    case 'rate_desc': errorData.sort((a, b) => b.rate - a.rate); break;
                }

                renderErrorTable();
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="9" style="color:red;text-align:center;">加载失败</td></tr>';
            }
        }

        function renderErrorTable() {
            const tbody = document.getElementById('errorTableBody');
            tbody.innerHTML = "";
            const start = (errorCurrentPage - 1) * errorPageSize;
            const pageData = errorData.slice(start, start + errorPageSize);

            pageData.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.word}</td>
                    <td>${item.phonetic || ''}</td>
                    <td>${item.explain || ''}</td>
                    <td>${item.polysemy || ''}</td>
                    <td>${item.derivative || ''}</td>
                    <td>${item.test_num}</td>
                    <td>${item.wrong_num}</td>
                    <td>${item.rate}%</td>
                `;
                tbody.appendChild(tr);
            });

            const totalPages = Math.ceil(errorData.length / errorPageSize);
            document.getElementById('errorPageInfo').textContent = `第 ${errorCurrentPage} / ${totalPages} 页`;
            document.getElementById('errorPrevBtn').disabled = errorCurrentPage === 1;
            document.getElementById('errorNextBtn').disabled = errorCurrentPage >= totalPages;
        }

        document.getElementById('errorPrevBtn').onclick = () => {
            if (errorCurrentPage > 1) { errorCurrentPage--; renderErrorTable(); }
        };
        document.getElementById('errorNextBtn').onclick = () => {
            const totalPages = Math.ceil(errorData.length / errorPageSize);
            if (errorCurrentPage < totalPages) { errorCurrentPage++; renderErrorTable(); }
        };
        document.getElementById('errorJumpBtn').onclick = () => {
            const target = parseInt(document.getElementById('errorJumpPageInput').value);
            const totalPages = Math.ceil(errorData.length / errorPageSize);
            if (target >= 1 && target <= totalPages) { errorCurrentPage = target; renderErrorTable(); }
        };
    </script>
</body>
