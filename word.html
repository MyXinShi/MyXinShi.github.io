          <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>高中3500词学习系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fa;padding:20px;font-family:Arial}
.main{max-width:700px;margin:80px auto;background:white;padding:40px;border-radius:16px;box-shadow:0 2px 12px #eee}
h2{margin-bottom:30px;color:#222;font-size:32px}
input,select{width:100%;padding:14px;margin:10px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{padding:14px 30px;background:#007bff;color:white;border:none;border-radius:10px;cursor:pointer;margin:8px 0;font-size:16px}
.gray{background:#666}
.card{padding:25px;border:1px solid #eee;border-radius:12px;margin:20px 0}
.word{font-size:28px;font-weight:bold;margin-bottom:10px}
.phon{color:#666;margin-bottom:15px}
.mean{line-height:1.6}
.hide{display:none}
#userBar{color:#007bff;margin-bottom:15px;font-size:18px}
.wrong-item{padding:10px;border-bottom:1px solid #eee}
</style>
</head>
<body>
<div class="main">
  <div id="loginBox">
    <h2>用户登录</h2>
    <select id="userSelect"><option>加载用户中…</option></select>
    <input type="password" id="pwd" placeholder="输入密码">
    <button onclick="login()">登录</button>
  </div>

  <div id="mainBox" class="hide">
    <div id="userBar"></div>
    <button onclick="goRecite()">背诵单词</button>
    <button onclick="goTest()">单词测试</button>
    <button onclick="goWrong()">我的错题</button>
    <button onclick="goChangePwd()">修改密码</button>
    <button class="gray" onclick="logout()">退出</button>

    <div id="reciteBox" class="card hide">
      <div class="word" id="rWord"></div>
      <div class="phon" id="rPhon"></div>
      <div class="mean" id="rMean"></div>
      <button onclick="flipWord()">翻面</button>
      <button class="gray" onclick="nextWord()">下一个</button>
    </div>

    <div id="testBox" class="card hide">
      <div id="tWord"></div>
      <input id="tAns" placeholder="输入中文释义">
      <button onclick="checkAns()">提交答案</button>
    </div>

    <div id="wrongBox" class="hide">
      <h3>我的错题</h3>
      <div id="wrongList"></div>
    </div>

    <div id="changePwdBox" class="card hide">
      <h3>修改密码</h3>
      <input id="newPwd" placeholder="新密码">
      <button onclick="saveNewPwd()">保存</button>
    </div>
  </div>
</div>

<script>
//替换成你自己的Vercel域名
const API = "https://xxx.vercel.app/api/sql";
let currentUser = null;
let nowWord = null;

(async function loadUser(){
  const res = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:"SELECT id,username FROM users ORDER BY id"})
  })
  const json = await res.json();
  const sel = document.getElementById("userSelect");
  sel.innerHTML = `<option value="">===选择登录用户===</option>`;
  json.rows.forEach(u=>sel.innerHTML += `<option value="${u.id}">${u.username}</option>`)
})()

async function login(){
  const uid = document.getElementById("userSelect").value;
  const pwd = document.getElementById("pwd").value.trim();
  if(!uid||!pwd) return alert("请选择用户并填写密码");
  const res = await fetch(API,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:`SELECT id,username FROM users WHERE id=${uid} AND password='${pwd}'`})
  })
  const json = await res.json();
  if(json.rows.length===0) return alert("密码错误");
  currentUser = json.rows[0];
  document.getElementById("userBar").innerText = `欢迎：${currentUser.username}`;
  document.getElementById("loginBox").classList.add("hide");
  document.getElementById("mainBox").classList.remove("hide");
  hideAll();
}

function logout(){
  currentUser=null;
  document.getElementById("mainBox").classList.add("hide");
  document.getElementById("loginBox").classList.remove("hide");
}

async function goRecite(){hideAll();document.getElementById("reciteBox").classList.remove("hide");await nextWord()}
async function nextWord(){
  const res = await fetch(API,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({query:"SELECT * FROM words ORDER BY RANDOM() LIMIT 1"})
  })
  const json = await res.json();
  nowWord = json.rows[0];
  document.getElementById("rWord").innerText = nowWord.word;
  document.getElementById("rPhon").innerText = nowWord.phonetic||"";
  document.getElementById("rMean").innerText = "点击翻面查看释义";
}
function flipWord(){
  document.getElementById("rMean").innerText =
`释义：${nowWord.explain}\n常用搭配：${nowWord.polysemy||"无"}\n派生词：${nowWord.derivative||"无"}`
}

async function goTest(){
  hideAll();document.getElementById("testBox").classList.remove("hide");
  const res = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:"SELECT * FROM words ORDER BY RANDOM() LIMIT 1"})})
  const json = await res.json();
  nowWord = json.rows[0];
  document.getElementById("tWord").innerText = `${nowWord.word} /${nowWord.phonetic||""}/`;
  document.getElementById("tAns").value = "";
}
async function checkAns(){
  const ans = document.getElementById("tAns").value.trim();
  const ok = ans === nowWord.explain;
  await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:`INSERT INTO learn_record(user_id,word_id,is_right) VALUES(${currentUser.id},${nowWord.id},${ok})`})})
  if(!ok){
    await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:`INSERT INTO wrong_word(user_id,word_id) VALUES(${currentUser.id},${nowWord.id}) ON CONFLICT DO NOTHING`})})
  }
  alert(ok?"答对啦！":"答错，释义："+nowWord.explain);
  goTest();
}

async function goWrong(){
  hideAll();document.getElementById("wrongBox").classList.remove("hide");
  const res = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:`SELECT w.* FROM wrong_word wr JOIN words w ON wr.word_id=w.id WHERE wr.user_id=${currentUser.id}`})})
  const json = await res.json();
  let html = "";
  json.rows.forEach(x=>html += `<div class="wrong-item">${x.word}：${x.explain}</div>`);
  document.getElementById("wrongList").innerHTML = html;
}

function goChangePwd(){hideAll();document.getElementById("changePwdBox").classList.remove("hide")}
async function saveNewPwd(){
  const newPwd = document.getElementById("newPwd").value.trim();
  if(!newPwd) return alert("填写新密码");
  await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:`UPDATE users SET password='${newPwd}' WHERE id=${currentUser.id}`})})
  alert("密码修改成功，下次登录生效");
  document.getElementById("newPwd").value = "";
}

function hideAll(){
  document.getElementById("reciteBox").classList.add("hide");
  document.getElementById("testBox").classList.add("hide");
  document.getElementById("wrongBox").classList.add("hide");
  document.getElementById("changePwdBox").classList.add("hide");
}
</script>
</body>
</html>

      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>
